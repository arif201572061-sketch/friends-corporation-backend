<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Customer Login - Friends Corporation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f1f8e9, #e8f5e9);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.12);
      overflow: hidden;
    }

    .header {
      background: #198754;
      color: white;
      text-align: center;
      padding: 25px 20px;
    }

    .header h1 {
      margin: 0;
      font-size: 27px;
    }

    .header p {
      margin: 8px 0 0;
      font-size: 14px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid #ddd;
    }

    .tab {
      width: 50%;
      padding: 15px;
      border: none;
      background: #f8f9fa;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      color: #555;
    }

    .tab.active {
      background: white;
      color: #198754;
      border-bottom: 3px solid #198754;
    }

    .form {
      padding: 25px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
      color: #333;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus,
    select:focus {
      border-color: #198754;
    }

    .btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      background: #198754;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .btn:hover {
      background: #157347;
    }

    .btn:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .otp-section {
      display: none;
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    .otp-input {
      text-align: center;
      font-size: 24px;
      letter-spacing: 8px;
      font-weight: bold;
    }

    .message {
      margin-top: 15px;
      padding: 11px;
      border-radius: 7px;
      display: none;
      font-size: 14px;
      text-align: center;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .development-otp {
      margin-top: 12px;
      padding: 12px;
      background: #fff3cd;
      border: 1px solid #ffecb5;
      border-radius: 8px;
      color: #664d03;
      text-align: center;
      display: none;
      font-weight: bold;
    }

    .back-home {
      text-align: center;
      padding: 0 25px 25px;
    }

    .back-home a {
      color: #198754;
      text-decoration: none;
      font-size: 14px;
    }

    .small-note {
      font-size: 12px;
      color: #777;
      margin-top: 5px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>Friends Corporation</h1>
    <p>Customer Account</p>
  </div>

  <div class="tabs">

    <button
      class="tab active"
      id="loginTab"
      onclick="showLogin()">
      Login
    </button>

    <button
      class="tab"
      id="registerTab"
      onclick="showRegister()">
      নতুন Account
    </button>

  </div>

  <!-- LOGIN -->
  <div id="loginForm" class="form">

    <div class="form-group">
      <label>মোবাইল নম্বর</label>

      <input
        type="tel"
        id="loginPhone"
        placeholder="01XXXXXXXXX"
        maxlength="11">

      <div class="small-note">
        এই মোবাইল নম্বর দিয়ে Customer Account থাকতে হবে।
      </div>
    </div>

    <button
      class="btn"
      id="loginOtpButton"
      onclick="requestLoginOTP()">
      OTP নিন
    </button>

    <div id="loginOtpSection" class="otp-section">

      <div class="form-group">

        <label>OTP দিন</label>

        <input
          type="text"
          id="loginOtp"
          class="otp-input"
          placeholder="000000"
          maxlength="6"
          inputmode="numeric">

      </div>

      <button
        class="btn"
        id="loginVerifyButton"
        onclick="verifyLoginOTP()">
        Login করুন
      </button>

    </div>

    <div
      id="loginDevOtp"
      class="development-otp">
    </div>

    <div
      id="loginMessage"
      class="message">
    </div>

  </div>


  <!-- REGISTER -->
  <div id="registerForm" class="form hidden">

    <div class="form-group">

      <label>Customer Name *</label>

      <input
        type="text"
        id="registerName"
        placeholder="আপনার নাম">

    </div>


    <div class="form-group">

      <label>মোবাইল নম্বর *</label>

      <input
        type="tel"
        id="registerPhone"
        placeholder="01XXXXXXXXX"
        maxlength="11">

    </div>


    <div class="form-group">

      <label>Email</label>

      <input
        type="email"
        id="registerEmail"
        placeholder="example@gmail.com">

    </div>


    <div class="form-group">

      <label>ঠিকানা</label>

      <input
        type="text"
        id="registerAddress"
        placeholder="আপনার ঠিকানা">

    </div>


    <div class="form-group">

      <label>Zone</label>

      <select id="registerZone">

        <option value="">
          Zone নির্বাচন করুন
        </option>

        <option value="চাঁদহাট">
          চাঁদহাট
        </option>

        <option value="দহিসার">
          দহিসার
        </option>

        <option value="জয়বাংলা">
          জয়বাংলা
        </option>

        <option value="ছোট-শ্রীবর্দী">
          ছোট-শ্রীবর্দী
        </option>

        <option value="কুমারদিয়া">
          কুমারদিয়া
        </option>

        <option value="দামদরদী">
          দামদরদী
        </option>

        <option value="ধর্মদী">
          ধর্মদী
        </option>

        <option value="আশফরদী">
          আশফরদী
        </option>

        <option value="নারায়নপুর">
          নারায়নপুর
        </option>

        <option value="গজারিয়া সার্কেল">
          গজারিয়া সার্কেল
        </option>

      </select>

    </div>


    <button
      class="btn"
      id="registerOtpButton"
      onclick="requestRegisterOTP()">

      OTP নিন এবং Account তৈরি করুন

    </button>


    <div id="registerOtpSection" class="otp-section">

      <div class="form-group">

        <label>OTP দিন</label>

        <input
          type="text"
          id="registerOtp"
          class="otp-input"
          placeholder="000000"
          maxlength="6"
          inputmode="numeric">

      </div>


      <button
        class="btn"
        id="registerVerifyButton"
        onclick="verifyRegisterOTP()">

        Account তৈরি করুন

      </button>

    </div>


    <div
      id="registerDevOtp"
      class="development-otp">
    </div>


    <div
      id="registerMessage"
      class="message">
    </div>

  </div>


  <div class="back-home">

    <a href="/">
      ← Home Page-এ ফিরে যান
    </a>

  </div>

</div>


<script>

  const API = "/api/customer-auth";


  // =========================
  // TAB SYSTEM
  // =========================

  function showLogin() {

    document
      .getElementById("loginForm")
      .classList.remove("hidden");

    document
      .getElementById("registerForm")
      .classList.add("hidden");

    document
      .getElementById("loginTab")
      .classList.add("active");

    document
      .getElementById("registerTab")
      .classList.remove("active");

  }


  function showRegister() {

    document
      .getElementById("registerForm")
      .classList.remove("hidden");

    document
      .getElementById("loginForm")
      .classList.add("hidden");

    document
      .getElementById("registerTab")
      .classList.add("active");

    document
      .getElementById("loginTab")
      .classList.remove("active");

  }


  // =========================
  // MESSAGE
  // =========================

  function showMessage(
    elementId,
    message,
    type
  ) {

    const element =
      document.getElementById(elementId);

    element.textContent = message;

    element.className =
      "message " + type;

    element.style.display = "block";

  }


  function hideMessage(elementId) {

    const element =
      document.getElementById(elementId);

    element.style.display = "none";

  }


  // =========================
  // PHONE VALIDATION
  // =========================

  function validPhone(phone) {

    return /^01\d{9}$/.test(phone);

  }


  // =========================
  // LOGIN - REQUEST OTP
  // =========================

  async function requestLoginOTP() {

    hideMessage("loginMessage");

    const phone =
      document
        .getElementById("loginPhone")
        .value
        .trim();


    if (!validPhone(phone)) {

      showMessage(
        "loginMessage",
        "সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন",
        "error"
      );

      return;
    }


    const button =
      document.getElementById(
        "loginOtpButton"
      );

    button.disabled = true;

    button.textContent =
      "OTP তৈরি হচ্ছে...";


    try {

      const response =
        await fetch(
          `${API}/request-otp`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              phone: phone,
              purpose: "login"
            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        showMessage(
          "loginMessage",
          data.message ||
            "OTP নেওয়া যায়নি",
          "error"
        );

        return;
      }


      document
        .getElementById(
          "loginOtpSection"
        )
        .style.display = "block";


      showMessage(
        "loginMessage",
        "OTP তৈরি হয়েছে। OTP দিন।",
        "success"
      );


      // DEVELOPMENT ONLY
      if (data.development_otp) {

        const devOtp =
          document.getElementById(
            "loginDevOtp"
          );

        devOtp.textContent =
          "Development OTP: " +
          data.development_otp;

        devOtp.style.display =
          "block";

      }

    } catch (error) {

      console.error(error);

      showMessage(
        "loginMessage",
        "Server-এর সাথে যোগাযোগ করা যাচ্ছে না",
        "error"
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "OTP নিন";

    }

  }


  // =========================
  // LOGIN - VERIFY OTP
  // =========================

  async function verifyLoginOTP() {

    hideMessage("loginMessage");

    const phone =
      document
        .getElementById("loginPhone")
        .value
        .trim();

    const otp =
      document
        .getElementById("loginOtp")
        .value
        .trim();


    if (!validPhone(phone)) {

      showMessage(
        "loginMessage",
        "সঠিক মোবাইল নম্বর দিন",
        "error"
      );

      return;
    }


    if (!/^\d{6}$/.test(otp)) {

      showMessage(
        "loginMessage",
        "৬ সংখ্যার OTP দিন",
        "error"
      );

      return;
    }


    const button =
      document.getElementById(
        "loginVerifyButton"
      );

    button.disabled = true;

    button.textContent =
      "Login হচ্ছে...";


    try {

      const response =
        await fetch(
          `${API}/verify-otp`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              phone: phone,

              otp: otp,

              purpose: "login"

            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        showMessage(
          "loginMessage",
          data.message ||
            "OTP verification failed",
          "error"
        );

        return;
      }


      // SAVE CUSTOMER LOGIN
      localStorage.setItem(
        "customer_token",
        data.token
      );


      localStorage.setItem(
        "customer",
        JSON.stringify(
          data.customer
        )
      );


      showMessage(
        "loginMessage",
        "Login সফল হয়েছে। Home Page-এ নেওয়া হচ্ছে...",
        "success"
      );


      setTimeout(() => {

        window.location.href = "/";

      }, 1000);


    } catch (error) {

      console.error(error);

      showMessage(
        "loginMessage",
        "Server-এর সাথে যোগাযোগ করা যাচ্ছে না",
        "error"
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "Login করুন";

    }

  }


  // =========================
  // REGISTER - REQUEST OTP
  // =========================

  async function requestRegisterOTP() {

    hideMessage("registerMessage");

    const name =
      document
        .getElementById("registerName")
        .value
        .trim();

    const phone =
      document
        .getElementById("registerPhone")
        .value
        .trim();

    const email =
      document
        .getElementById("registerEmail")
        .value
        .trim();

    const address =
      document
        .getElementById("registerAddress")
        .value
        .trim();

    const zone =
      document
        .getElementById("registerZone")
        .value;


    if (!name) {

      showMessage(
        "registerMessage",
        "Customer Name দিন",
        "error"
      );

      return;
    }


    if (!validPhone(phone)) {

      showMessage(
        "registerMessage",
        "সঠিক ১১ সংখ্যার মোবাইল নম্বর দিন",
        "error"
      );

      return;
    }


    const button =
      document.getElementById(
        "registerOtpButton"
      );

    button.disabled = true;

    button.textContent =
      "OTP তৈরি হচ্ছে...";


    try {

      const response =
        await fetch(
          `${API}/request-otp`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              phone: phone,

              purpose: "register"

            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        showMessage(
          "registerMessage",
          data.message ||
            "OTP নেওয়া যায়নি",
          "error"
        );

        return;
      }


      document
        .getElementById(
          "registerOtpSection"
        )
        .style.display = "block";


      showMessage(
        "registerMessage",
        "OTP তৈরি হয়েছে। OTP দিন।",
        "success"
      );


      // DEVELOPMENT ONLY
      if (data.development_otp) {

        const devOtp =
          document.getElementById(
            "registerDevOtp"
          );

        devOtp.textContent =
          "Development OTP: " +
          data.development_otp;

        devOtp.style.display =
          "block";

      }

    } catch (error) {

      console.error(error);

      showMessage(
        "registerMessage",
        "Server-এর সাথে যোগাযোগ করা যাচ্ছে না",
        "error"
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "OTP নিন এবং Account তৈরি করুন";

    }

  }


  // =========================
  // REGISTER - VERIFY OTP
  // =========================

  async function verifyRegisterOTP() {

    hideMessage("registerMessage");

    const name =
      document
        .getElementById("registerName")
        .value
        .trim();

    const phone =
      document
        .getElementById("registerPhone")
        .value
        .trim();

    const otp =
      document
        .getElementById("registerOtp")
        .value
        .trim();

    const email =
      document
        .getElementById("registerEmail")
        .value
        .trim();

    const address =
      document
        .getElementById("registerAddress")
        .value
        .trim();

    const zone =
      document
        .getElementById("registerZone")
        .value;


    if (!name) {

      showMessage(
        "registerMessage",
        "Customer Name দিন",
        "error"
      );

      return;
    }


    if (!validPhone(phone)) {

      showMessage(
        "registerMessage",
        "সঠিক মোবাইল নম্বর দিন",
        "error"
      );

      return;
    }


    if (!/^\d{6}$/.test(otp)) {

      showMessage(
        "registerMessage",
        "৬ সংখ্যার OTP দিন",
        "error"
      );

      return;
    }


    const button =
      document.getElementById(
        "registerVerifyButton"
      );

    button.disabled = true;

    button.textContent =
      "Account তৈরি হচ্ছে...";


    try {

      const response =
        await fetch(
          `${API}/verify-otp`,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              phone: phone,

              otp: otp,

              purpose: "register",

              name: name,

              email:
                email || null,

              address:
                address || null,

              zone:
                zone || null

            })
          }
        );


      const data =
        await response.json();


      if (!response.ok) {

        showMessage(
          "registerMessage",
          data.message ||
            "Account তৈরি করা যায়নি",
          "error"
        );

        return;
      }


      // SAVE CUSTOMER LOGIN
      localStorage.setItem(
        "customer_token",
        data.token
      );


      localStorage.setItem(
        "customer",
        JSON.stringify(
          data.customer
        )
      );


      showMessage(
        "registerMessage",
        "Account সফলভাবে তৈরি হয়েছে। Home Page-এ নেওয়া হচ্ছে...",
        "success"
      );


      setTimeout(() => {

        window.location.href = "/";

      }, 1000);


    } catch (error) {

      console.error(error);

      showMessage(
        "registerMessage",
        "Server-এর সাথে যোগাযোগ করা যাচ্ছে না",
        "error"
      );

    } finally {

      button.disabled = false;

      button.textContent =
        "Account তৈরি করুন";

    }

  }

</script>

</body>
</html>
